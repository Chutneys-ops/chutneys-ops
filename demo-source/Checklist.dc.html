<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chutneys Ops - opening checklist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B47}a:hover{color:#174F35}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F2; color: #1F2A24; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 20px 22px; gap: 14px">
  <a href="StaffHome.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 14px; font-weight: 500; text-decoration: none; color: #1F6B47">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    Truck 2 today
  </a>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px">Opening checklist</h1>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #5B6560">
      <span>{{doneCount}} of {{total}} done</span>
      <span>Each tick saves the time and your name</span>
    </div>
    <div style="height: 8px; border-radius: 999px; background: #E6E0D3; overflow: hidden">
      <div style="height: 8px; border-radius: 999px; background: #1F6B47; width: {{pct}}"></div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="8">
      <button type="button" onClick="{{item.toggle}}" aria-pressed="{{item.pressed}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 9px 12px; background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 12px; text-align: left; font-family: Inter, sans-serif; color: #1F2A24; cursor: pointer">
        <sc-if value="{{item.done}}" hint-placeholder-val="{{ false }}">
          <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; background: #1F6B47; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          </span>
        </sc-if>
        <sc-if value="{{item.open}}" hint-placeholder-val="{{ true }}">
          <span style="width: 26px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 8px; border: 2px solid #A9A08E"></span>
        </sc-if>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 500; line-height: 1.35">{{item.label}}</span>
          <sc-if value="{{item.done}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 12px; color: #1F6B47">{{item.stamp}}</span>
          </sc-if>
        </span>
      </button>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <sc-if value="{{submitted}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="background: #E7F1EB; border: 1px solid #A9CFB8; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; color: #174F35">Submitted at {{submitTime}}. The manager can see it now.</div>
    </sc-if>
    <sc-if value="{{showButton}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{submit}}" disabled="{{notReady}}" style="min-height: 50px; border: none; border-radius: 12px; background: {{btnBg}}; color: {{btnFg}}; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">{{btnLabel}}</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ITEMS = [
  { id: 'gas', label: 'Gas bottles checked and secured' },
  { id: 'gen', label: 'Generator fuel and power OK' },
  { id: 'hand', label: 'Handwash station set up with soap and paper towels' },
  { id: 'fridge', label: 'Fridges at 5°C or below' },
  { id: 'san', label: 'Surface sanitiser made up' },
  { id: 'label', label: 'Prep containers labelled and dated' },
  { id: 'eft', label: 'EFTPOS terminal charged and online' },
  { id: 'float', label: 'Float counted ($200)' }
];
function nowLabel() {
  const d = new Date();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return h + ':' + m + ' ' + ap;
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      done: { gas: '10:04 am', gen: '10:05 am', hand: '10:07 am' },
      submitTime: ''
    };
  }
  renderVals() {
    const done = this.state.done;
    const doneCount = ITEMS.filter((it) => done[it.id]).length;
    const ready = doneCount === ITEMS.length;
    const submitted = this.state.submitTime !== '';
    const items = ITEMS.map((it) => ({
      label: it.label,
      done: !!done[it.id],
      open: !done[it.id],
      pressed: done[it.id] ? 'true' : 'false',
      stamp: done[it.id] ? 'Ticked ' + done[it.id] + ' by Priya' : '',
      toggle: () => {
        if (this.state.submitTime) return;
        const next = Object.assign({}, this.state.done);
        if (next[it.id]) { delete next[it.id]; } else { next[it.id] = nowLabel(); }
        this.setState({ done: next });
      }
    }));
    return {
      items: items,
      doneCount: doneCount,
      total: ITEMS.length,
      pct: Math.round((doneCount / ITEMS.length) * 100) + '%',
      submitted: submitted,
      showButton: !submitted,
      submitTime: this.state.submitTime,
      notReady: !ready,
      btnBg: ready ? '#1F6B47' : '#DCD5C6',
      btnFg: ready ? '#FFFFFF' : '#4A4438',
      btnLabel: ready ? 'Submit checklist' : 'Tick every item to submit',
      submit: () => { if (ready) this.setState({ submitTime: nowLabel() }); }
    };
  }
}
</script>
</body>
</html>

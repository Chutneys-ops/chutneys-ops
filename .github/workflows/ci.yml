# CI for Chutneys Ops: checks, unit tests, RLS tests and a production build.
#
# Every action is pinned to a full commit SHA, not a tag: a tag can be moved
# to different code by whoever controls that repo, a SHA can't. The comment
# says which version it is; Dependabot (.github/dependabot.yml) updates both.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node (same major version as local)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Root install gives us the pinned Supabase CLI (devDependency).
      - name: Install root dependencies (Supabase CLI)
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Known vulnerabilities in what we install. Fails on high or critical;
      # fix with `npm audit fix` (or wait for the Dependabot PR).
      - name: Dependency audit (root)
        run: npm audit --audit-level=high

      - name: Dependency audit (web)
        working-directory: web
        run: npm audit --audit-level=high

      # ---- Fast checks first: fail early before pulling Docker images ----

      - name: TypeScript check
        working-directory: web
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test

      # ---- Database: local Supabase stack + RLS tests ----

      # Only Postgres, auth (gotrue), the API gateway (kong), PostgREST and
      # storage (the invoice storage policies and tests need it).
      - name: Start local Supabase
        run: >
          npx supabase start
          -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Create every bucket in supabase/config.toml: invoices, verifier-packs,
      # leave-documents and signatures.
      - name: Create storage buckets
        run: npx supabase seed buckets

      # Includes security_guards.test.sql: RLS on every table, nothing for
      # anon, fixed search_path on security definer functions, no public
      # buckets.
      - name: RLS tests (pgTAP)
        run: npx supabase test db

      # Supabase's database linter (plpgsql_check): broken function bodies,
      # unused variables, wrong types. Fails on warnings too.
      - name: Database lint
        run: npx supabase db lint --level warning --fail-on warning

      # Copy the local URL and publishable key into the env of later steps.
      - name: Export Supabase env for the build
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      # ---- Production build ----

      - name: Production build
        working-directory: web
        run: npm run build

# Dependabot: weekly pull requests to update dependencies, so security fixes
# arrive without anyone having to remember to look. Each PR runs CI like any
# other; merge it when CI is green.
#
# Minor and patch updates are grouped into one PR per folder to keep the
# noise down; major versions come one at a time (they can break things).
version: 2
updates:
  # Root: the pinned Supabase CLI.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The Next.js app.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions in .github/workflows. They're pinned to commit SHAs;
  # Dependabot updates the SHA and the "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Pacific/Auckland
    groups:
      actions:
        patterns: ["*"]
